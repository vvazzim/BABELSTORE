<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A101C"/>
      <stop offset="60%" stop-color="#231317"/>
      <stop offset="100%" stop-color="#140E10"/>
    </linearGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED59B"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B3B"/>
    </linearGradient>

    <!-- Warm Ceramic Gradient -->
    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F4ECE1"/>
      <stop offset="100%" stop-color="#DDD3C3"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.65"/>

  <!-- Sculptural Monogram 'B' -->
  <g filter="url(#softShadow)" transform="translate(156, 100)">
    <!-- Main stem -->
    <path d="M 30,20 L 30,200 C 30,206 34,210 40,210 L 95,210 C 145,210 180,185 180,145 C 180,120 162,102 140,95 C 158,88 172,72 172,50 C 172,16 140,0 95,0 L 40,0 C 34,0 30,4 30,10 Z" 
          fill="url(#ceramicGrad)"/>
    
    <!-- Top counter cutout -->
    <path d="M 62,32 L 95,32 C 122,32 142,42 142,62 C 142,82 122,92 95,92 L 62,92 Z" 
          fill="url(#bgGrad)"/>
    
    <!-- Bottom counter cutout -->
    <path d="M 62,118 L 98,118 C 128,118 150,130 150,154 C 150,178 128,190 98,190 L 62,190 Z" 
          fill="url(#bgGrad)"/>

    <!-- Gold Ribbon / Arc Accent -->
    <path d="M 140,95 C 152,98 165,108 172,122 C 160,118 145,116 132,118 Z" 
          fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="380" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Cinzel', 'Georgia', 'Times New Roman', serif" 
        font-size="44" 
        font-weight="700" 
        letter-spacing="12" 
        fill="url(#goldGrad)">BABEL</text>

  <text x="256" y="420" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Inter', 'Helvetica Neue', sans-serif" 
        font-size="16" 
        font-weight="500" 
        letter-spacing="10" 
        fill="#EDE6DA" 
        opacity="0.9">STORE</text>

  <!-- Stars / Accent dots -->
  <circle cx="150" cy="415" r="2.5" fill="url(#goldGrad)"/>
  <circle cx="362" cy="415" r="2.5" fill="url(#goldGrad)"/>
</svg>
